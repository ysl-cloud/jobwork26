let D={},cur=0;
try{D=JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch(e){D={}}
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(D))}catch(e){}};
const val=k=>(D[k]==null?'':String(D[k]));
const gm=()=>[val('grade'),val('dept').split('/')[0].trim()].filter(Boolean).join(' ')||'[학년/전공]';
function fill(t){
 const m={gm:gm(),interest:val('interest')||'[관심사나 경험]',field:val('field')||'[분야]',job:val('job')||'[직무명]',co:val('co')||'[기업명]',jobp:val('jobp')||val('job')||'[직무명]',
  ck:val('my_0_0')||'[K 목록]',cs:val('my_1_0')||'[S 목록]',ca:val('my_2_0')||'[A 목록]',why:val('why')||'[직접 입력]'};
 return t.replace(/\{(\w+)\}/g,(_,k)=>m[k]);
}
/* 진행률 대상 키 */
function keysOf(s){const o=[];s.b.forEach(b=>{if(b.t==='f')b.items.forEach(i=>o.push(i.k));
 if(b.t==='g')b.rows.forEach((_,r)=>b.cols.forEach((_,c)=>o.push(`${b.gk}_${r}_${c}`)));
 if(b.t==='ksa')R(5).forEach(r=>R(3).forEach(c=>o.push(`${b.gk}_${r}_${c}`)));});return o}
const pct=s=>{const ks=keysOf(s);if(!ks.length)return null;return Math.round(100*ks.filter(k=>val(k).trim()).length/ks.length)};
